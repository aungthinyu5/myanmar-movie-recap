<!DOCTYPE html>
<html lang="my">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Myanmar AI Movie Recap</title>
    <style>
        * { box-sizing: border-box; }
        body { margin: 0; font-family: Arial, sans-serif; background: #f4f5fa; color: #202033; }
        header { background: white; padding: 16px; display: flex; justify-content: space-between; align-items: center; box-shadow: 0 2px 8px #ddd; }
        header h2 { margin: 0; color: #5145e5; font-size: 20px; }
        main { max-width: 700px; margin: auto; padding: 16px; }
        .card { background: white; border-radius: 20px; padding: 20px; margin-bottom: 16px; box-shadow: 0 2px 10px #00000008; }
        .upload { border: 2px dashed #aaa5f5; border-radius: 16px; padding: 30px 12px; text-align: center; background: #f9f8ff; }
        button, select, input, textarea { font-size: 16px; }
        button { background: #5145e5; color: white; border: none; border-radius: 12px; padding: 12px 20px; cursor: pointer; }
        #preview { width: 100%; max-height: 300px; display: none; margin-top: 10px; border-radius: 10px; }
        #status { margin-top: 10px; font-weight: bold; word-break: break-all; }
    </style>
</head>
<body>
    <header>
        <h2>🎬 Myanmar AI Recap</h2>
    </header>
    <main>
        <section class="card">
            <h3>🎥 Movie Recap Studio</h3>
            <div class="upload">
                <button id="chooseBtn" type="button">📁 Video ရွေးရန်</button>
                <input type="file" id="videoFile" accept="video/*" style="display:none;">
                <p id="fileInfo">ဖိုင်မရွေးချယ်ရသေးပါ</p>
                <video id="preview" controls></video>
            </div>
        </section>

        <section class="card">
            <h3>🤖 AI Processing</h3>
            <button id="processBtn" type="button" style="width:100%">🚀 AI Recap စတင်ရန်</button>
            <div id="status" role="status" aria-live="polite"></div>
        </section>
    </main>

    <script>
        (() => {
            const fileInput = document.getElementById('videoFile');
            const chooseBtn = document.getElementById('chooseBtn');
            const preview = document.getElementById('preview');
            const fileInfo = document.getElementById('fileInfo');
            const statusBox = document.getElementById('status');
            const processBtn = document.getElementById('processBtn');
            let currentUrl = null;

            chooseBtn.addEventListener('click', () => fileInput.click());

            fileInput.addEventListener('change', () => {
                const file = fileInput.files && fileInput.files[0];
                if (!file) {
                    fileInfo.textContent = 'ဖိုင်မရွေးချယ်ရသေးပါ';
                    return;
                }
                if (currentUrl) URL.revokeObjectURL(currentUrl);
                currentUrl = URL.createObjectURL(file);
                fileInfo.textContent = 'ဖိုင်အမည်: ' + file.name + ' | အရွယ်အစား: ' + (file.size / (1024 * 1024)).toFixed(2) + ' MB';
                preview.style.display = 'block';
                preview.src = currentUrl;
                preview.load();
                statusBox.textContent = 'ဗီဒီယိုကို အောင်မြင်စွာ ရွေးပြီးပါပြီ။';
            });

            processBtn.addEventListener('click', async () => {
                if (!fileInput.files || !fileInput.files[0]) {
                    statusBox.textContent = 'အရင်ဆုံး "Video ရွေးရန်" ကိုနှိပ်ပြီး ဗီဒီယိုရွေးပါ။';
                    fileInput.focus();
                    return;
                }
                
                statusBox.textContent = 'AI ဖြင့် စာသားများ ထုတ်ယူနေပါပြီ... ခဏစောင့်ပေးပါ။';
                
                try {
                    const response = await fetch("https://myanmarmovierecapapi.winkowin357.workers.dev", {
                        method: "POST",
                        headers: { "Content-Type": "application/json" },
                        body: JSON.stringify({ 
                            text: "Video file name: " + fileInput.files[0].name, 
                            task: "recap" 
                        })
                    });
                    
                    const data = await response.json();
                    if (data.result) {
                        statusBox.textContent = '✨ AI Recap ရလဒ်: ' + data.result;
                    } else {
                        statusBox.textContent = 'Error: ' + (data.error || 'Unknown error');
                    }
                } catch (err) {
                    statusBox.textContent = 'Network Error: ' + err.message;
                }
            });
        })();
    </script>
</body>
</html>
